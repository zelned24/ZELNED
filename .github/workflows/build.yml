name: Build Nintendo 3DS Homebrew (.3dsx)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-3dsx:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ZelNeD.3dsx
        run: |
          export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH
          cd 3ds
          make clean || true
          make

      - name: Upload 3DSX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZelNeD-3dsx
          path: |
            3ds/ZelNeD.3dsx
            3ds/ZelNeD.smdh

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-build
          name: "ZelNeD 3DS Executable"
          body: "Official compiled Nintendo 3DS executable (ZelNeD.3dsx) ready for Homebrew Launcher."
          draft: false
          prerelease: false
          files: |
            3ds/ZelNeD.3dsx
            3ds/ZelNeD.smdh
