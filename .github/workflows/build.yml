name: Build Nintendo 3DS Homebrew (.3dsx)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-3dsx:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ZelNeD.3dsx
        run: |
          export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH
          cd 3ds
          make 2>&1 | tee /tmp/build.log
          echo "=== Top dir listing ==="
          ls -la
          echo "=== Build dir listing ==="
          ls -la build/ || true

      - name: Upload 3DSX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZelNeD-3dsx
          path: |
            **/*.3dsx
            **/*.smdh

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
